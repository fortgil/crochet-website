<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a5c2" />
      <stop offset="50%" stop-color="#e75480" />
      <stop offset="100%" stop-color="#b3395b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="100%" stop-color="#ffd1dc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Central Rosette Crochet Flower Icon -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Flower Petals Outer -->
    <circle cx="0" cy="-70" r="48" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="67" cy="-22" r="48" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="41" cy="57" r="48" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="-41" cy="57" r="48" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="-67" cy="-22" r="48" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Flower Petals Inner -->
    <circle cx="0" cy="-40" r="34" fill="#ffffff" opacity="0.98" />
    <circle cx="38" cy="-12" r="34" fill="#ffffff" opacity="0.98" />
    <circle cx="23" cy="33" r="34" fill="#ffffff" opacity="0.98" />
    <circle cx="-23" cy="33" r="34" fill="#ffffff" opacity="0.98" />
    <circle cx="-38" cy="-12" r="34" fill="#ffffff" opacity="0.98" />

    <!-- Rose Center Heart -->
    <circle cx="0" cy="0" r="30" fill="#e75480" />
    <!-- Crochet Spiral -->
    <path d="M-10,-5 Q0,-18 12,-6 Q18,8 2,16 Q-14,14 -12,-2 Q-10,-10 0,-10" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

    <!-- Crochet Hook Accent -->
    <path d="M-90,95 L95,-90" stroke="#fce4ec" stroke-width="7" stroke-linecap="round" />
    <!-- Hook Tip -->
    <path d="M95,-90 Q105,-100 100,-108 Q92,-108 85,-98" fill="none" stroke="#fce4ec" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- App Title Banner -->
  <text x="256" y="440" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">TWIZIE</text>
  <text x="256" y="472" font-family="'Lato', sans-serif" font-size="20" font-weight="300" fill="#ffd1dc" text-anchor="middle" letter-spacing="4">ROSETTE CROCHET</text>
</svg>
